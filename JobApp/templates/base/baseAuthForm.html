<!doctype html>
<html lang="en" >
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 px-4 py-5">
            <div class="card-body">
                <h2 class="fw-bold text-center mb-4 text-primary">{{ title }}</h2>
                <form method="POST" novalidate>
                    {% csrf_token %}
                    
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-secondary">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small mt-1">
                                    {{ field.errors|striptags }}
                                </div>
                            {% endif %}
                        </div>
                    {% endfor %}

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold shadow-sm">{{ btn }}</button>
                    </div>
                </form>
                
                {% if title == "Login Form" %}
                    <p class="text-center text-muted mt-4 mb-0 small">
                        Don't have an account? <a href="{% url 'register' %}" class="text-decoration-none fw-semibold">Register here</a>
                    </p>
                {% else %}
                    <p class="text-center text-muted mt-4 mb-0 small">
                        Already have an account? <a href="{% url 'login' %}" class="text-decoration-none fw-semibold">Login here</a>
                    </p>
                {% endif %}
            </div>
        </div>
    </div>
</div>

<script>
    // Inject clean Bootstrap styling directly into Django's generated fields
    document.querySelectorAll('input, select, textarea').forEach(element => {
        if (element.type !== 'checkbox' && element.type !== 'radio') {
            element.classList.add('form-control');
        } else {
            element.classList.add('form-check-input');
        }
    });
</script>
 <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
